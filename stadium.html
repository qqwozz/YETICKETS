<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лужники — YETICKETS</title>
<link rel="stylesheet" href="style.css">
<style>
  .stadium-page {
    background: #fff;
    color: #000;
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* TOPBAR */
  .stadium-page .topbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 22px 28px;
    text-transform: uppercase;
  }
  .stadium-page .topbar a {
    color: #000;
    text-decoration: none;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .stadium-page .topbar span {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.3em;
  }

  /* HEADING */
  .stadium-page .heading {
    text-align: center;
    padding: 0 20px 8px;
  }
  .stadium-page .heading h1 {
    font-size: clamp(38px, 7vw, 72px);
    font-weight: 900;
    letter-spacing: -0.04em;
    text-transform: uppercase;
    margin: 0;
    line-height: 0.9;
  }
  .stadium-page .heading p {
    margin: 10px 0 0;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.4em;
    text-transform: uppercase;
  }

  /* MAP — растягивается на свободное место */
  .stadium-page .map {
    flex: 1;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 0;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .stadium-page .map svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* SECTORS */
  .stadium-page .sector {
    fill: #fff;
    stroke: #000;
    stroke-width: 1;
    cursor: pointer;
  }
  .stadium-page .sector:hover,
  .stadium-page .sector:focus {
    fill: #000;
    outline: none;
  }
  .stadium-page .sector.on {
    fill: #000;
    stroke: #fff;
    stroke-width: 1;
  }
  .stadium-page .lbl {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px;
    fill: #000;
    pointer-events: none;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .stadium-page .lbl.on { fill: #fff; }
  .stadium-page .lbl.sm { font-size: 6.5px; }

  /* BAR */
  .stadium-page .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    width: 100%;
    padding: 18px 28px;
    background: #000;
    color: #fff;
    box-sizing: border-box;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .stadium-page .bar__info {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    opacity: 0.6;
  }
  .stadium-page .bar__info strong {
    opacity: 1;
    font-weight: 700;
  }
  .stadium-page .bar__total {
    font-weight: 900;
    font-size: 16px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .stadium-page .bar__clear {
    background: none;
    border: 0;
    color: #fff;
    opacity: 0.5;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0;
  }
  .stadium-page .bar__clear:hover { opacity: 1; }
  .stadium-page .bar__clear[hidden] { display: none; }
  .stadium-page .bar__buy {
    background: #fff;
    color: #000;
    border: 1px solid #fff;
    padding: 14px 26px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .stadium-page .bar__buy:hover { opacity: 0.85; }
  .stadium-page .bar__buy:disabled {
    background: transparent;
    color: #fff;
    opacity: 0.25;
    cursor: default;
  }

  /* FOOTER */
  .stadium-page .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 28px;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.5;
  }

  /* PUSH — уведомление о покупке */
  .push {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translate(-50%, -200%);
    background: #000;
    color: #fff;
    padding: 20px 28px;
    min-width: 320px;
    max-width: calc(100vw - 32px);
    box-sizing: border-box;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    z-index: 9999;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .push.is-visible {
    transform: translate(-50%, 0);
  }
  .push__title {
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 0.2em;
  }
  .push__body {
    font-weight: 400;
    font-size: 10px;
    letter-spacing: 0.15em;
    opacity: 0.7;
    line-height: 1.6;
  }
  .push__close {
    position: absolute;
    top: 8px;
    right: 12px;
    background: none;
    border: 0;
    color: #fff;
    font-size: 20px;
    font-weight: 300;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    opacity: 0.5;
    font-family: inherit;
  }
  .push__close:hover { opacity: 1; }

  @media (max-width: 640px) {
    .stadium-page .topbar a { font-size: 22px; }
    .stadium-page .heading h1 { font-size: 34px; }
    .stadium-page .bar {
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 18px;
    }
    .stadium-page .bar__info { width: 100%; flex: none; }
    .stadium-page .bar__buy { flex: 1; padding: 12px 18px; }
    .stadium-page .footer { padding: 14px 18px; }
    .push { min-width: 0; width: calc(100vw - 32px); }
  }
</style>
</head>
<body>
<div class="stadium-page">

  <div class="topbar">
    <a href="index.html">YETICKETS</a>
    <span>RESALE TICKETS</span>
  </div>

  <div class="heading">
    <h1>LUZHNIKI</h1>
    <p>SELECT SECTIONS</p>
  </div>

  <div class="map">
    <svg viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet" id="svg">
      <path id="bowl" fill="#fff" stroke="#000" stroke-width="1"/>
      <g id="pitch">
        <rect x="292" y="246" width="316" height="208" fill="#000"/>
        <text x="450" y="360" text-anchor="middle"
              font-family="IBM Plex Mono, monospace"
              font-size="40" font-weight="900"
              letter-spacing="-0.04em" fill="#fff">YE</text>
      </g>
      <g id="layer"></g>
    </svg>
  </div>

  <div class="bar">
    <span class="bar__info" id="info">NOTHING SELECTED</span>
    <span class="bar__total" id="total">0 ₽</span>
    <button class="bar__clear" id="clear" hidden>clear</button>
    <button class="bar__buy" id="buy" disabled>Buy</button>
  </div>

  <footer class="footer">
    <span style="font-weight:700;color:#000">YEEZY.COM</span>
    <span>© 2026 YETICKETS</span>
  </footer>

</div>

<!-- PUSH -->
<div class="push" id="push" role="status" aria-live="polite">
  <button class="push__close" id="push-close" aria-label="Close">×</button>
  <span class="push__title" id="push-title">TICKETS PURCHASED</span>
  <span class="push__body" id="push-body"></span>
</div>

<script>
const PRICE = 8000;
const fmt = n => n.toLocaleString('ru-RU') + ' ₽';

/* ---------- Stadium geometry ---------- */
const CX = 450, CY = 350, N = 4;
const TIERS = [
  {key:'lower', count:44, a0:190, b0:128, a1:282, b1:205, start:101},
  {key:'loge',  count:22, a0:287, b0:210, a1:305, b1:228, start:201},
  {key:'upper', count:52, a0:310, b0:233, a1:428, b1:332, start:301}
];
const sgn = v => v < 0 ? -1 : 1;
function P(a, b, t){
  const c = Math.cos(t), s = Math.sin(t), e = 2 / N;
  return [CX + a * sgn(c) * Math.pow(Math.abs(c), e),
          CY + b * sgn(s) * Math.pow(Math.abs(s), e)];
}
function arc(a, b, t0, t1, steps){
  const pts = [];
  for (let i = 0; i <= steps; i++) pts.push(P(a, b, t0 + (t1 - t0) * i / steps));
  return pts;
}
function sectorPath(T, t0, t1){
  const o = arc(T.a1, T.b1, t0, t1, 6);
  const i = arc(T.a0, T.b0, t1, t0, 6);
  return 'M' + o.concat(i).map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z';
}

document.getElementById('bowl').setAttribute('d',
  'M' + arc(436, 338, 0, Math.PI * 2, 120).map(p => p.join(' ')).join('L') + 'Z');

/* ---------- Generate sectors ---------- */
const layer = document.getElementById('layer');
const svgNS = 'http://www.w3.org/2000/svg';
const selected = new Map();

TIERS.forEach(T => {
  const step = Math.PI * 2 / T.count;
  for (let i = 0; i < T.count; i++){
    const t0 = -Math.PI / 2 + i * step + .004;
    const t1 = t0 + step - .008;
    const tm = (t0 + t1) / 2;
    const name = String(T.start + i);

    const g = document.createElementNS(svgNS, 'g');
    const p = document.createElementNS(svgNS, 'path');
    p.setAttribute('d', sectorPath(T, t0, t1));
    p.setAttribute('class', 'sector');
    p.setAttribute('tabindex', '0');
    p.setAttribute('role', 'button');
    p.setAttribute('aria-label', 'Сектор ' + name);
    const ti = document.createElementNS(svgNS, 'title');
    ti.textContent = name;
    p.appendChild(ti);
    g.appendChild(p);

    let labelEl = null;
    if (T.key !== 'loge'){
      const pos = P((T.a0 + T.a1) / 2, (T.b0 + T.b1) / 2, tm);
      const tx = document.createElementNS(svgNS, 'text');
      tx.setAttribute('x', pos[0]); tx.setAttribute('y', pos[1]);
      tx.setAttribute('class', 'lbl' + (T.key === 'lower' ? ' sm' : ''));
      tx.setAttribute('text-anchor', 'middle');
      tx.setAttribute('dominant-baseline', 'middle');
      tx.textContent = name;
      g.appendChild(tx);
      labelEl = tx;
    }

    const toggle = () => {
      if (selected.has(name)) {
        selected.delete(name);
        p.classList.remove('on');
        if (labelEl) labelEl.classList.remove('on');
      } else {
        selected.set(name, {el: p, lbl: labelEl});
        p.classList.add('on');
        if (labelEl) labelEl.classList.add('on');
      }
      render();
    };
    p.addEventListener('click', toggle);
    p.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
    });
    layer.appendChild(g);
  }
});

/* ---------- UI ---------- */
const infoEl = document.getElementById('info');
const totalEl = document.getElementById('total');
const buyEl = document.getElementById('buy');
const clearEl = document.getElementById('clear');

function render(){
  const names = [...selected.keys()];
  if (!names.length){
    infoEl.textContent = 'NOTHING SELECTED';
    totalEl.textContent = '0 ₽';
    buyEl.disabled = true;
    clearEl.hidden = true;
    return;
  }
  infoEl.innerHTML = '<strong>' + names.length + '</strong> · ' + names.join(' · ');
  totalEl.textContent = fmt(names.length * PRICE);
  buyEl.disabled = false;
  clearEl.hidden = false;
}

clearEl.onclick = () => {
  selected.forEach(v => {
    v.el.classList.remove('on');
    if (v.lbl) v.lbl.classList.remove('on');
  });
  selected.clear();
  render();
};

/* ---------- PUSH ---------- */
const pushEl = document.getElementById('push');
const pushTitle = document.getElementById('push-title');
const pushBody = document.getElementById('push-body');
const pushClose = document.getElementById('push-close');
let pushTimer = null;

function showPush(title, body){
  pushTitle.textContent = title;
  pushBody.textContent = body;
  pushEl.classList.add('is-visible');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(hidePush, 6000);
}

function hidePush(){
  pushEl.classList.remove('is-visible');
  clearTimeout(pushTimer);
}

pushClose.onclick = hidePush;

/* ---------- Buy ---------- */
buyEl.onclick = () => {
  const names = [...selected.keys()];
  if (!names.length) return;
  const total = fmt(names.length * PRICE);
  showPush(
    'TICKETS PURCHASED',
    'Sections: ' + names.join(', ') + ' · Total: ' + total
  );
  // сбросить выбор после "покупки"
  selected.forEach(v => {
    v.el.classList.remove('on');
    if (v.lbl) v.lbl.classList.remove('on');
  });
  selected.clear();
  render();
};
</script>
</body>
</html>
